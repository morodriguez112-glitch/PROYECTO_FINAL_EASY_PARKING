#Esta carpeta se hizo solita, cuando descargo las dependencias.

#El nombre de mi proyecto.
spring.application.name=proyectofinaleasyparking

#Acá es la ruta de la base de datos, que se conecte por el puerto 3306 NO OLVIDARLO (ese es el puerto por defecto de mysql)
# y el nombre de la base de datos que cree en phpmyadmin.
spring.datasource.url=jdbc:mysql://localhost:3306/proyectofinaleasyparking

#Este es el usuario por defecto de XAMPP que es "root" y va sin contraseña
spring.datasource.username=root
spring.datasource.password=

#Esto es el conector que permite que Java se conecte, hable, dialogue con MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Acá es si cambio algo en mis clases Java (model),
## actualiza la tabla en MySQL sin borrar los datos que ya tengo guardados
spring.jpa.hibernate.ddl-auto=update

#Me muestra en la ventanita de abajo de IntelliJ
# (crear, editar, borrar), me muestra abajo en la consola de IntelliJ qué hizo en la base de datos
spring.jpa.show-sql=true

