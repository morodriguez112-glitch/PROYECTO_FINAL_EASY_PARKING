<!-- El home.html no necesita buscar datos en la base de datos, pero la lista de usuarios sí,
por eso no creé el HomeView -->

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Easy-Parking</title> <!-- este es el titulo de la pestaña del navegador -->
    <!-- Aquí coloco el script de Tailwind "donde ponemos estilos bonitos"
     para que el navegador los cargue y los aplique antes de empezar a mostrar la página-->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Mis estilos personalizados con Thymeleaf
    Al colocar 'xmlns:th="http://www.thymeleaf.org"', le estamos diciendo al archivo HTML
    que uso como si fuera un asistente (Thymeleaf).
    Gracias a esto, este HTML dejará de ser una página estática y podrá recibir
    los datos dinámicos que le mande Java y la Base de Datos.
    por ejemplo: Sin Thymeleaf (HTML normal): Tendría que escribir a mano en el código el nombre de cada usuario uno por uno,
    y si se registra alguien nuevo, tendría que modificar el código fuente de la página web, por eso uso thymeleaf -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<!-- me base en el framework de Tailwind para hacer mi home (componentes) -->
<body class="antialiased bg-gradient-to-br from-green-100 to-white">
<div class="container px-6 mx-auto">
    <div
            class="flex flex-col text-center md:text-left md:flex-row h-screen justify-evenly md:items-center">
        <div class="flex flex-col w-full">
            <div>
                <svg
                        class="w-20 h-20 mx-auto md:float-left fill-stroke text-gray-800"
                        fill="none"
                        stroke="currentColor"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                    <path
                            stroke-linecap="round"
                            stroke-linejoin="round"
                            stroke-width="2"
                            d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path>
                </svg>
            </div>
            <h1 class="text-5xl text-gray-800 font-bold">Easy Parking</h1>
            <p class="w-5/12 mx-auto md:mx-0 text-gray-500">
                <!--Controla y supervisa los datos de mi sitio web desde el panel de control..-->
            </p>
        </div>
        <div class="w-full md:w-full lg:w-9/12 mx-auto md:mx-0">
            <div class="bg-white p-10 flex flex-col w-full shadow-xl rounded-xl">
                <h2 class="text-2xl font-bold text-gray-800 text-left mb-5">
                    Iniciar sesión
                </h2>
                <form action="" class="w-full">
                    <div id="input" class="flex flex-col w-full my-5">
                        <label for="usuario" class="text-gray-500 mb-2"
                        >Usuario</label>
                        <input
                                type="text"
                                id="usuario"
                                placeholder="Por favor ingrese su usuario"
                                class="appearance-none border-2 border-gray-100 rounded-lg px-4 py-3 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:shadow-lg"/>
                    </div>
                    <div id="input" class="flex flex-col w-full my-5">
                        <label for="contraseña" class="text-gray-500 mb-2"
                        >Contraseña</label>
                        <input
                                type="contraseña"
                                id="contraseña"
                                placeholder="Por favor ingrese su contraseña"
                                class="appearance-none border-2 border-gray-100 rounded-lg px-4 py-3 placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-green-600 focus:shadow-lg"/>
                    </div>
                    <div id="button" class="flex flex-col w-full my-5">
                        <button
                                type="button"
                                class="w-full py-4 font-medium text-white bg-green-600 hover:bg-green-500 rounded-lg border-green-500 hover:shadow inline-flex space-x-2 items-center justify-center"
                        >
                            <div class="flex flex-row items-center justify-center">
                                <div class="mr-2">
                                    <svg
                                            class="w-6 h-6"
                                            fill="none"
                                            stroke="currentColor"
                                            viewBox="0 0 24 24"
                                            xmlns="http://www.w3.org/2000/svg">
                                        <path
                                                stroke-linecap="round"
                                                stroke-linejoin="round"
                                                stroke-width="2"
                                                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
                                        ></path>
                                    </svg>
                                </div>
                                <div class="font-bold">Iniciar Sesión</div>
                            </div>
                        </button>
                        <div class="flex justify-evenly mt-5">
                            <a
                                    th:href="@{/recuperar}"
                                    class="w-full text-center font-medium text-indigo-600">
                                <!-- acá es donde conecto con el controller de /recuperar antes estaba "href="#"
                            ahora lo paso a th:href="@{/recuperar}" para conectar el botón con esa pantalla -->

                            Recuperar Contraseña</a>

                            <a
                                    th:href="@{/view/usuarios/formulario}"
                                    class="w-full text-center font-medium text-indigo-600">
                            Registrarse</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
<!-- recordar que este script de JavaScript va siempre al final, justo antes de cerrar el </body>,
    para darle interactividad a la página después de que el HTML haya cargado por completo

    RECORDATORIO!!!! El DOM es el esqueleto vivo que Chrome arma en su memoria cuando lee mi HTML, cuando doy F12 -->

<script>
    // Paso 1: Agarro el botón verde (acá le digo al DOM "oye este es el botón que estoy voy a llamar"
    const botondeIniciarSesion = document.querySelector('.bg-green-600');

    // Paso 2: Acá es cuando el botón hace el 'click'
    botondeIniciarSesion.addEventListener('click', () => {

        // Paso 3: Aquí es cuando yo digo que "ejecución" deseo que haga cuando el usuario haga click en el botón
        botondeIniciarSesion.disabled = true; // Esto bloquea el botón
        botondeIniciarSesion.textContent = "Cargando..."; // Esto cambia el texto cuando el usuario hace click en dicho botón
    });
</script>
</body>
</html>
