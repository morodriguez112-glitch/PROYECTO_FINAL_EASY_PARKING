<!--
  *list" es la pantalla de lectura.
  * Sirve para ver todos los usuarios que ya están guardados en la base de datos.
  * Aquí uso Thymeleaf para listar los datos en una tabla.
  * Este archivo SIEMPRE va en cualquier software porque el administrador necesita ver los datos guardados.

  * Esto es parte del front end. Donde encuentro los (Archivos HTML y CSS como este).
  Es lo que ve el usuario cuando entra a la aplicación. -->

<!DOCTYPE html>
<!-- esto declara que el documento es HTML 5 -->
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- El html lang ="en" es el idioma que se va a manejar y el xmlns:th="http://www.thymeleaf.org">
    es el motor de plantillas thymeleaf (une los datos de java, con los archivos en html, o sea los datos de la base de datos) -->
<head>
    <meta charset="UTF-8">
    <!-- No olvidar que este método es para que la página de los usuarios se adapte al celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Usuarios</title>
    <!-- Esté <title>Lista de Usuarios</title> es el título que se muestra en la pestaña del navegador -->

    <!-- Esta línea conecta el framework de Tailwind CSS desde internet para poder usar sus diseños y siempre va a ir debajo del <title> -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!--el link del css siempre va a este momento antes de finalizar el head-->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<!-- cuadrito general que da forma de tarjeta doble -->
<div class="user-dashboard-container">

    <!-- lado izqu el cuadrito de títulos y las escripciones -->
    <div class="user-sidebar-panel">
        <h2>Gestión de Usuarios</h2>
        <p>Easy parking, gestión de parqueaderos comuncales.</p>
    </div>

    <!-- Lado derecho del diseño de la tabla-->
    <div class="user-content-panel">

    <h1>Lista de Usuarios</h1>
    <table class="styled-table">
        <thead>
        <tr>
            <th>Acciones</th>
            <th>ID Usuario</th>
            <th>Apellido</th>
            <th>Contraseña</th>
            <th>Correo</th>
            <th>Documento</th>
            <th>Nombre</th>
            <th>Placa</th>
            <th>Rol</th>
            <th>Telefono</th>
        </tr>
        </thead>
        <tbody>

        <!--ACA CORREMOS LA LISTA-->

        <tr th:each="usuario : ${usuarios}"> <!-- ESTE ES EL MOTODO PARA CORRER-->

                <td>
                    <!--PARA EDITAR
                    RECOMENDACION PARA NO OLVIDAR
                    No podemos usar el siguiente metodo porque <form method="post"> para Eliminar por seguridad y buenas prácticas
                    para realizar una acción de cambio o borrado en la base de datos. Por ende usamos Usamos <a> para Editar porque
                    solo nos redirige a una vista (GET) y no realiza ninguna acción de cambio en la base de datos
                    <form th:href="@{'/view/usuarios/update/' + ${usuario.id_usuario}}" method="get">
                    <button type="submit">Editar</button>
                    </form> -->

                    <a th:href="@{'/view/usuarios/update/' + ${usuario.id_usuario}}">Editar</a>

                   <!-- PARA ELIMINAR-->

                    <form th:action="@{'/view/usuarios/delete/' +${usuario.id_usuario}}" method="post">

                        <button type="submit">Eliminar</button>
                    </form>

                </td>
                    <td th:text="${usuario.id_usuario}"></td>
                    <td th:text="${usuario.apellido}"></td>
                    <td th:text="${usuario.contrasena}"></td>
                    <td th:text="${usuario.correo}"></td>
                    <td th:text="${usuario.documento}"></td>
                    <td th:text="${usuario.nombre}"></td>
                    <td th:text="${usuario.placa}"></td>
                    <td th:text="${usuario.rol}"></td>
                    <td th:text="${usuario.telefono}"></td>
            </tr>

        <!-- ESTE ES PARA VALIDAR SI NO EXISTEN USUARIOS-->
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="9">No hay usuarios resgistrados.</td>
        </tr>
        </tbody>
    </table>
    <br/>
    <button><a th:href="@{/view/usuarios/formulario}">Agregar Nuevo Usuario</a></button>
    </div>
</div>

<!-- REGLA DE ORO: Este script de JavaScript va siempre al final,
     justo antes de cerrar el </body>, para darle interactividad a la página después de que el HTML haya cargado por completo
     este es el ejemplo de la estructura:
<script>
    // Aquí agrego el código JavaScript
</script> -->
</body>
</html>
